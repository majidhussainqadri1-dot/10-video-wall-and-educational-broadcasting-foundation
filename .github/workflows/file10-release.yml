name: File 10 Release QA
on:
  push:
    branches: ['codex/**','fix/**','main']
  pull_request:
permissions:
  contents: read
env:
  VWLB_PUBLISH_REVIEW_ARTIFACT: '1'
jobs:
  source-package-qa:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify fixed runner toolchain
        run: |
          command -v zip
          command -v unzip
          command -v sha256sum
          zip -v | head -n 2
          unzip -v | head -n 2
          sha256sum --version | head -n 1
          php -v
      - name: Run complete automated suite
        run: bash ./tests/run-all.sh
      - name: Run R101-R120 sequential regression gate
        run: bash ./tests/file10-r101-r120-contracts.sh
      - name: Run R118 provenance regression gate
        run: bash ./tests/file10-r118-contracts.sh
      - name: Run R119 fail-closed read-integrity gate
        run: bash ./tests/file10-r119-contracts.sh
      - name: Run R125 archived-correction workflow gate
        run: bash ./tests/file10-r125-contracts.sh
      - name: Run R126 QA environment drift gate
        run: bash ./tests/file10-r126-contracts.sh
      - name: Build canonical package
        run: bash ./tools/build-package.sh packages/video-wall-and-live-broadcasting-1.2.25-rc1.zip
      - name: Verify checksum and archive
        run: |
          cd packages
          sha256sum --check video-wall-and-live-broadcasting-1.2.25-rc1.zip.sha256
          unzip -t video-wall-and-live-broadcasting-1.2.25-rc1.zip
      - name: Verify package/source parity
        run: |
          rm -rf /tmp/vwlb-extract && mkdir -p /tmp/vwlb-extract
          unzip -q packages/video-wall-and-live-broadcasting-1.2.25-rc1.zip -d /tmp/vwlb-extract
          diff -ru video-wall-and-live-broadcasting /tmp/vwlb-extract/video-wall-and-live-broadcasting
      - name: Publish release-candidate artifact
        if: matrix.php == '8.3' && env.VWLB_PUBLISH_REVIEW_ARTIFACT == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file10-video-wall-live-1.2.25-rc1
          path: |
            packages/video-wall-and-live-broadcasting-1.2.25-rc1.zip
            packages/video-wall-and-live-broadcasting-1.2.25-rc1.zip.sha256
