name: File 10 Release QA
on:
  push:
    branches: ['codex/**','fix/**','main']
  pull_request:
permissions:
  contents: read
jobs:
  source-package-qa:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3','8.4']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Run complete automated suite
        run: bash ./tests/run-all.sh
      - name: Build canonical package
        run: bash ./tools/build-package.sh packages/video-wall-and-live-broadcasting-1.2.5-rc1.zip
      - name: Verify checksum and archive
        run: |
          cd packages
          sha256sum --check video-wall-and-live-broadcasting-1.2.5-rc1.zip.sha256
          unzip -t video-wall-and-live-broadcasting-1.2.5-rc1.zip
      - name: Verify package/source parity
        run: |
          rm -rf /tmp/vwlb-extract && mkdir -p /tmp/vwlb-extract
          unzip -q packages/video-wall-and-live-broadcasting-1.2.5-rc1.zip -d /tmp/vwlb-extract
          diff -ru video-wall-and-live-broadcasting /tmp/vwlb-extract/video-wall-and-live-broadcasting
      - name: Publish release-candidate artifact
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: file10-video-wall-live-1.2.5-rc1
          path: |
            packages/video-wall-and-live-broadcasting-1.2.5-rc1.zip
            packages/video-wall-and-live-broadcasting-1.2.5-rc1.zip.sha256
