name: Bootstrap File 10 Corrections

on:
  push:
    branches:
      - fix/file-10-security-integrity
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  expand-verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: fix/file-10-security-integrity

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli zip unzip

      - name: Reconstruct and verify corrective source bundle
        run: |
          cat .bootstrap/file10-bundle.b64.part* | tr -d '\r\n' | base64 --decode > /tmp/file10-corrective-repository-bundle.tar.gz
          echo '9e26e62bdd391ad7dadf9725b1dc5ace0710a838fb16b76793462c305f54f16f  /tmp/file10-corrective-repository-bundle.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/file10-corrective-repository-bundle.tar.gz -C .

      - name: Validate corrected source
        run: |
          chmod +x tests/static-contracts.sh tools/build-package.sh
          find video-wall -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          node --check video-wall/assets/js/video-wall.js
          ./tests/static-contracts.sh

      - name: Build and verify corrected package
        run: |
          ./tools/build-package.sh
          echo 'eebed41b671b9eefcae4933000e57e1a15076a1aed1883e1fe0b94b4ad8e6c68  packages/10-video-wall-and-educational-broadcasting-foundation-0.2.0.zip' | sha256sum --check --strict
          grep '  video-wall/' CHECKSUMS-0.2.0.sha256 | sha256sum --check --strict
          unzip -t packages/10-video-wall-and-educational-broadcasting-foundation-0.2.0.zip

      - name: Publish corrected tracked source
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-file10-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct File 10 security and integrity defects'
          git push origin HEAD:fix/file-10-security-integrity
