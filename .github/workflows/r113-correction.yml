name: File 10 R113 Correction
on:
  push:
    branches:
      - fix/file10-r101-r120-sequential-2026-09-06
    paths:
      - tools/.r113-correction-trigger
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file10-r101-r120-sequential-2026-09-06
          fetch-depth: 0
      - name: Apply frozen R113 corrections
        run: python3 tools/r113-finalize.py
      - name: Validate R113 correction
        run: |
          git diff --check
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-r113-mutation-read-integrity.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-podcasts.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-live.php
          php -l video-wall-and-live-broadcasting/video-wall-and-live-broadcasting.php
          bash -n tests/file10-r101-r120-contracts.sh
          bash tests/file10-r101-r120-contracts.sh
          bash tests/run-all.sh
      - name: Commit R113 correction batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video-wall-and-live-broadcasting README.md MANIFEST.md STATUS.md tests/file10-r101-r120-contracts.sh tests/run-all.sh tools/build-package.sh SBOM-1.2.24-rc1.json docs/FILE-10-R113-FROZEN-FINDINGS-2026-09-08.md
          git commit -m 'Correct R113 mutation read integrity boundaries'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
