name: File 10 R110 Correction

on:
  push:
    branches:
      - fix/file10-r101-r120-sequential-2026-09-06
    paths:
      - tools/.r110-correction-trigger

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file10-r101-r120-sequential-2026-09-06
          fetch-depth: 0
      - name: Apply frozen R110 corrections
        run: |
          python3 tools/r110-prepatch.py
          python3 tools/r110-apply.py
      - name: Validate correction before commit
        run: |
          git diff --check
          for f in \
            video-wall-and-live-broadcasting/includes/class-vwlb-r3-playback.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-videos.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-repository.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-frontend.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-r109-rights-consent-replay-guard.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-r71-private-download-guard.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-r72-podcast-boundary-guard.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-r78-public-delivery-guard.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-r79-watermark-session-guard.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-r91-unlisted-access-guard.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-review-hardening.php \
            video-wall-and-live-broadcasting/includes/class-vwlb-extensions.php \
            video-wall-and-live-broadcasting/video-wall-and-live-broadcasting.php; do php -l "$f"; done
          bash -n tests/file10-r101-r120-contracts.sh
          bash tests/file10-r101-r120-contracts.sh
          bash tests/run-all.sh
      - name: Commit R110 correction batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video-wall-and-live-broadcasting tests/file10-r101-r120-contracts.sh tests/run-all.sh SBOM-1.2.21-rc1.json
          git commit -m 'Correct R110 public delivery boundaries'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
