name: Apply R104 historical harness repair
on:
  push:
    branches: ['fix/file10-r101-r120-sequential-2026-09-06']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run R104 harness repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file10-r101-r120-sequential-2026-09-06
          fetch-depth: 0
      - name: Rebase historical assertions to current R104 evidence
        run: python3 tools/fix-r104-harness.py
      - name: Commit harness repair
        run: |
          git config user.name 'Sabri File 10 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f tools/fix-r104-harness.py review-patches/r104-harness.run
          git add tests/run-all.sh
          git commit -m 'R104 retest: rebase historical evidence assertions'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
