name: R106 correction batch
on:
  push:
    branches:
      - fix/file10-r101-r120-sequential-2026-09-06
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply frozen R106 corrections
        run: python3 tools/r106-apply.py
      - name: Validate correction batch
        run: |
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-r76-cleanup-durability.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-extensions.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-jobs.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-sequential-review-hardening.php
          bash tests/file10-r101-r120-contracts.sh
      - name: Commit correction batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video-wall-and-live-broadcasting/includes/class-vwlb-r76-cleanup-durability.php video-wall-and-live-broadcasting/includes/class-vwlb-extensions.php video-wall-and-live-broadcasting/includes/class-vwlb-jobs.php video-wall-and-live-broadcasting/includes/class-vwlb-sequential-review-hardening.php tests/file10-r101-r120-contracts.sh
          git commit -m 'File 10 R106: harden upload scan and cleanup safety'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
