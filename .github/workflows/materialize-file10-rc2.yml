name: Materialize File 10 RC2 source

on:
  push:
    branches:
      - codex/file-10-four-round-completion-v1.0.0-rc2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ -f .codex/READY ]] || { echo 'Payload incomplete; waiting for READY.'; exit 0; }
          mapfile -t chunks < <(find .codex -maxdepth 1 -type f -name 'chunk-*.b64' | sort)
          [[ ${#chunks[@]} -eq 8 ]] || { echo 'Expected 8 chunks.'; exit 1; }
          : > /tmp/file10-rc2-source.zip
          for chunk in "${chunks[@]}"; do base64 -d "$chunk" >> /tmp/file10-rc2-source.zip; done
          echo 'f7cf58f27053e5792adebde337976dd5427ee84249209a39c1e67c79f3b93d7d  /tmp/file10-rc2-source.zip' | sha256sum --check -
          unzip -t /tmp/file10-rc2-source.zip
          unzip -o /tmp/file10-rc2-source.zip -d .
          chmod +x tests/*.sh tests/*.py tools/*.sh
          rm -rf .payload2 .payload .codex
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete four-round File 10 correction release 1.0.0-rc2'
          git push origin HEAD:${GITHUB_REF_NAME}
