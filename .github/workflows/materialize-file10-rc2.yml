name: Materialize File 10 RC2 source

on:
  push:
    branches:
      - codex/file-10-four-round-completion-v1.0.0-rc2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          [[ -f .payload2/READY ]] || { echo 'Payload incomplete; waiting for READY.'; exit 0; }
          mapfile -t chunks < <(find .payload2 -maxdepth 1 -type f -name 'part-*.b64' | sort)
          [[ ${#chunks[@]} -eq 7 ]] || { echo 'Expected 7 chunks.'; exit 1; }
          : > /tmp/file10-rc2-source.tar.xz
          for chunk in "${chunks[@]}"; do base64 -d "$chunk" >> /tmp/file10-rc2-source.tar.xz; done
          echo '381b1fb405fab8edf43a3c3aeea3043c8b71e5aeabd61b5a357c6f3c81d4d0ce  /tmp/file10-rc2-source.tar.xz' | sha256sum --check -
          xz -t /tmp/file10-rc2-source.tar.xz
          tar -xJf /tmp/file10-rc2-source.tar.xz -C .
          chmod +x tests/*.sh tests/*.py tools/*.sh
          rm -rf .payload2 .payload .codex
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete four-round File 10 correction release 1.0.0-rc2'
          git push origin HEAD:${GITHUB_REF_NAME}
