name: Materialize File 10 RC2 source

on:
  push:
    branches:
      - codex/file-10-four-round-completion-v1.0.0-rc2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, materialize, test, and commit RC2
        shell: bash
        run: |
          set -euo pipefail
          [[ -f .payload3/READY ]] || { echo 'Payload incomplete; waiting for READY.'; exit 0; }
          : > /tmp/file10-rc2-source.tar.xz
          for index in 00 01 02 03 04 05 06 07 08; do
            chunk=".payload3/part-${index}.b64"
            [[ -f "$chunk" ]] || { echo "Missing chunk: $chunk"; exit 1; }
            size="$(wc -c < "$chunk")"
            [[ "$size" -ge 8000 ]] || { echo "Short chunk: $chunk ($size bytes)"; exit 1; }
            head -c 8000 "$chunk" | base64 -d >> /tmp/file10-rc2-source.tar.xz
          done
          final_chunk='.payload3/part-09.b64'
          [[ "$(wc -c < "$final_chunk")" -eq 2784 ]] || { echo 'Invalid final chunk size.'; exit 1; }
          base64 -d "$final_chunk" >> /tmp/file10-rc2-source.tar.xz
          echo '381b1fb405fab8edf43a3c3aeea3043c8b71e5aeabd61b5a357c6f3c81d4d0ce  /tmp/file10-rc2-source.tar.xz' | sha256sum --check -
          xz -t /tmp/file10-rc2-source.tar.xz

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .payload3 ! -name .github -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 -type f ! -name materialize-file10-rc2.yml -delete
          tar -xJf /tmp/file10-rc2-source.tar.xz -C .
          chmod +x tests/*.sh tests/*.py tools/*.sh
          ./tests/run-all-rc2.sh

          rm -rf .payload3 .payload2 .payload .codex
          rm -f .github/workflows/materialize-file10-rc2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete four-round File 10 correction release 1.0.0-rc2'
          git push origin HEAD:${GITHUB_REF_NAME}
