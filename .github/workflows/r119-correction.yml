name: File 10 R119 Correction

on:
  push:
    branches:
      - fix/file10-r101-r120-sequential-2026-09-06
    paths:
      - tools/.r119-correction-trigger

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file10-r101-r120-sequential-2026-09-06
          fetch-depth: 0
      - name: Apply frozen R119 corrections
        run: python3 tools/r119-apply-hotfix.py
      - name: Validate R119 correction
        run: |
          git diff --check
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-extended-rest.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-podcasts.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-extensions.php
          bash -n tests/file10-r119-contracts.sh
          bash tests/file10-r119-contracts.sh
          bash tests/run-all.sh
          bash tests/file10-r101-r120-contracts.sh
          bash -x tests/file10-r118-contracts.sh
      - name: Commit R119 correction batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video-wall-and-live-broadcasting/includes/class-vwlb-extended-rest.php video-wall-and-live-broadcasting/includes/class-vwlb-podcasts.php video-wall-and-live-broadcasting/includes/class-vwlb-extensions.php
          git commit -m 'Correct R119 residual authoritative reads'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
