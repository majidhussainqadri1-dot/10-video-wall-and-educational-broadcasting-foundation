name: Apply R104 syntax repair
on:
  push:
    branches: ['fix/file10-r101-r120-sequential-2026-09-06']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Run R104 syntax repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file10-r101-r120-sequential-2026-09-06
          fetch-depth: 0
      - name: Repair correction-generated literal tab prefixes
        run: python3 tools/fix-r104-literal-tabs.py
      - name: PHP lint corrected files
        run: |
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-db.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-extensions.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-podcasts.php
          php -l video-wall-and-live-broadcasting/includes/class-vwlb-future-safety.php
      - name: Commit R104 correction syntax repair
        run: |
          git config user.name 'Sabri File 10 Review Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f tools/fix-r104-literal-tabs.py review-patches/r104-syntax.run
          git add video-wall-and-live-broadcasting/includes/class-vwlb-db.php video-wall-and-live-broadcasting/includes/class-vwlb-extensions.php video-wall-and-live-broadcasting/includes/class-vwlb-podcasts.php video-wall-and-live-broadcasting/includes/class-vwlb-future-safety.php
          git commit -m 'R104 retest: repair correction syntax encoding'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
