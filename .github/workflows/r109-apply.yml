name: File 10 R109 Correction Runner

on:
  push:
    branches:
      - fix/file10-r101-r120-sequential-2026-09-06

permissions:
  contents: write

jobs:
  apply-r109:
    if: github.event.head_commit.message == 'R109 correction runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file10-r101-r120-sequential-2026-09-06
          fetch-depth: 0
      - name: Apply frozen R109 correction batch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/r109-apply.py')
          t=p.read_text()
          old="ut=ut.replace(\"'vwlb_r76_upload_cleanup_cursor','vwlb_allow_purge'\",\"'vwlb_r76_upload_cleanup_cursor','vwlb_r109_consent_expiry_cursor','vwlb_allow_purge'\",1)"
          new="ut=ut.replace(\"'vwlb_r108_redundancy_reconcile_cursor','vwlb_allow_purge'\",\"'vwlb_r108_redundancy_reconcile_cursor','vwlb_r109_consent_expiry_cursor','vwlb_allow_purge'\",1)"
          if old not in t:
              raise SystemExit('R109 uninstall patch-source pattern not found')
          p.write_text(t.replace(old,new,1))
          PY
          python3 tools/r109-apply.py
      - name: Commit correction batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md STATUS.md MANIFEST.md SBOM-1.2.20-rc1.json tests/run-all.sh tests/file10-r101-r120-contracts.sh video-wall-and-live-broadcasting
          git diff --cached --check
          git commit -m 'R109 correction applied 1.2.20-rc1'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
