name: R107 release identity alignment
on:
  push:
    branches:
      - fix/file10-r101-r120-sequential-2026-09-06
permissions:
  contents: write
jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Align R107 candidate identity
        run: |
          python3 <<'PY'
          from pathlib import Path
          old='1.2.17-rc1'; new='1.2.18-rc1'
          p=Path('video-wall-and-live-broadcasting/video-wall-and-live-broadcasting.php')
          t=p.read_text(); t=t.replace('Version: '+old,'Version: '+new,1).replace("define( 'VWLB_VERSION', '"+old+"' );","define( 'VWLB_VERSION', '"+new+"' );",1); p.write_text(t)
          p=Path('tests/run-all.sh'); t=p.read_text(); t=t.replace("CURRENT_VERSION='"+old+"'","CURRENT_VERSION='"+new+"'",1); p.write_text(t)
          p=Path('.github/workflows/file10-release.yml'); t=p.read_text().replace(old,new); p.write_text(t)
          p=Path('video-wall-and-live-broadcasting/readme.txt'); t=p.read_text(); t=t.replace('Stable tag: '+old,'Stable tag: '+new,1).replace('video-wall-and-live-broadcasting-'+old+'.zip','video-wall-and-live-broadcasting-'+new+'.zip',1)
          marker='= '+old+' =\n'
          section=('= '+new+' =\n'
                   '* R107: enforce canonical opaque IDs across late REST overrides and re-resolve authorized playback state before enrichment.\n'
                   '* Contain provider compensation callbacks inside Throwable boundaries and centralize recursive raw-credential detection across Future metadata/configuration surfaces.\n'
                   '* Separate implementation presence from evidence-backed runtime/provider readiness and reset provider-health DB error state before availability decisions.\n\n')
          if section not in t:
              if marker not in t: raise SystemExit('readme changelog marker missing')
              t=t.replace(marker,section+marker,1)
          p.write_text(t)
          p=Path('README.md'); t=p.read_text(); t=t.replace('- Runtime: `'+old+'`','- Runtime: `'+new+'`',1)
          anchor='Candidate identity is `1.2.17-rc1`; final exact-head R106 release QA is still required before R107 may begin.\n'
          replacement=('Candidate identity `1.2.17-rc1` completed R106 exact-head release QA before R107 began.\n\n'
                       'R107 then completed a full read-only provider/webhook/secrets/readiness review before correction. Five proven findings were frozen: permissive late REST identifier overrides plus stale playback enrichment, incomplete provider-compensation Throwable containment, incomplete raw-secret key detection, stale `$wpdb->last_error` contamination of provider-health availability, and Future capability reporting that did not clearly separate implementation presence from runtime readiness. The correction closes those boundaries and advances the candidate to `'+new+'`; final exact-head R107 release QA is required before R108 may begin.\n')
          if anchor in t: t=t.replace(anchor,replacement,1)
          t=t.replace('`1.2.17-rc1` is the current R106 repository/source correction candidate and must not be treated as Automated-QA Green until its exact-head PHP 8.3/8.4 release QA, deterministic packaging, checksum/archive verification, package/source parity and artifact publication all pass.', '`'+new+'` is the current R107 repository/source correction candidate and must not be treated as Automated-QA Green until its exact-head PHP 8.3/8.4 release QA, deterministic packaging, checksum/archive verification, package/source parity and artifact publication all pass.',1)
          p.write_text(t)
          p=Path('MANIFEST.md'); t=p.read_text(); t=t.replace('# File 10 Release Candidate Manifest — '+old,'# File 10 Release Candidate Manifest — '+new,1).replace('- Plugin version: `'+old+'`','- Plugin version: `'+new+'`',1).replace('packages/video-wall-and-live-broadcasting-'+old+'.zip','packages/video-wall-and-live-broadcasting-'+new+'.zip',1).replace('- SBOM: `SBOM-'+old+'.json`','- SBOM: `SBOM-'+new+'.json`',1)
          t=t.replace('- Current review boundary: R101–R120 sequential cycle; R101–R105 are QA-closed at their recorded exact reviewed heads. R106 review/freeze/correction is complete and its final exact-head release QA is pending; R107 must not begin until that gate is green.','- Current review boundary: R101–R120 sequential cycle; R101–R106 are QA-closed at their recorded exact reviewed heads. R107 review/freeze/correction is complete; final exact-head R107 release QA is pending and R108 must not begin until that gate is green.',1)
          t += '\n- R107 frozen findings: late permissive REST IDs/stale playback enrichment; incomplete provider-compensation Throwable boundaries; incomplete secret-key detection; stale provider-health DB error contamination; implementation-vs-runtime readiness ambiguity.\n- R107 correction candidate identity: `'+new+'`.\n'
          p.write_text(t)
          p=Path('STATUS.md'); t=p.read_text(); t=t.replace('# File 10 Status — '+old,'# File 10 Status — '+new,1).replace('- Coded/reviewed candidate: `'+old+'` on','- Coded/reviewed candidate: `'+new+'` on',1)
          t=t.replace('- Automated-QA Green: R101–R105 established. R106 final exact-head release QA is pending; R107 is blocked until R106 is green.','- Automated-QA Green: R101–R106 established. R107 final exact-head release QA is pending; R108 is blocked until R107 is green.',1)
          t += '\n- R107 review: completed read-only before correction; five findings frozen covering late REST opaque-ID/playback enrichment, provider compensation exception containment, recursive secret detection, provider-health DB truth, and capability/readiness semantics.\n- R107 correction: applied; candidate identity advanced to `'+new+'` for exact-head release QA before R108.\n'
          p.write_text(t)
          sbom=Path('SBOM-'+new+'.json')
          sbom.write_text('''{\n  "bomFormat": "Sabri-Public-SBOM",\n  "specVersion": "1.0",\n  "component": {\n    "name": "video-wall-and-live-broadcasting",\n    "version": "'''+new+'''",\n    "type": "wordpress-plugin"\n  },\n  "runtime": {\n    "wordpress": ">=7.0",\n    "php": ">=8.3"\n  },\n  "schemas": {\n    "base": "1.1.0",\n    "extension": "1.1.0",\n    "future": "1.2.0"\n  },\n  "bundledThirdPartyRuntimeLibraries": [],\n  "externalServiceAdapters": ["local", "youtube", "vimeo", "custom"],\n  "notes": "R107 correction candidate: canonical opaque-ID and playback-enrichment boundaries, provider compensation exception containment, centralized recursive raw-secret detection, provider-health DB truth reset, and explicit implementation-vs-runtime readiness semantics. Repository/package QA remains distinct from staging, live deployment and operational acceptance."\n}\n''')
          PY
          php -l video-wall-and-live-broadcasting/video-wall-and-live-broadcasting.php
          bash tests/file10-r101-r120-contracts.sh
          bash tests/static-contracts.sh
      - name: Commit identity alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add video-wall-and-live-broadcasting/video-wall-and-live-broadcasting.php video-wall-and-live-broadcasting/readme.txt tests/run-all.sh .github/workflows/file10-release.yml README.md MANIFEST.md STATUS.md SBOM-1.2.18-rc1.json
          git commit -m 'File 10 R107: align immutable 1.2.18-rc1 release identity'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
