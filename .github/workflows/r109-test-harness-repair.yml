name: File 10 R109 Test Harness Repair

on:
  push:
    branches:
      - fix/file10-r101-r120-sequential-2026-09-06
    paths:
      - tools/.r109-test-harness-trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file10-r101-r120-sequential-2026-09-06
          fetch-depth: 0
      - name: Repair shell literal assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/file10-r101-r120-contracts.sh')
          t=p.read_text()
          replacements={
            'grep -F "current_delivery_allowed($object,$purpose)"': "grep -F 'current_delivery_allowed($object,$purpose)'",
            'grep -F "assert_consent_transition($current,$status)"': "grep -F 'assert_consent_transition($current,$status)'",
            'grep -F "record_consent_change($locked,$id,$before,$status,$ref)"': "grep -F 'record_consent_change($locked,$id,$before,$status,$ref)'",
            'grep -F "assert_replay($event,$video)"': "grep -F 'assert_replay($event,$video)'",
          }
          for old,new in replacements.items():
              if old not in t:
                  raise SystemExit('missing harness literal: '+old)
              t=t.replace(old,new,1)
          p.write_text(t)
          PY
          git diff --check
          bash -n tests/file10-r101-r120-contracts.sh
      - name: Commit harness repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/file10-r101-r120-contracts.sh
          git commit -m 'Repair R109 shell regression assertions'
          git push origin HEAD:fix/file10-r101-r120-sequential-2026-09-06
