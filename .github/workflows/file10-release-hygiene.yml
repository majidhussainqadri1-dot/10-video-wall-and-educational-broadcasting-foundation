name: File 10 Release Hygiene Finalizer
on:
  push:
    branches:
      - fix/file-10-third-fresh-20-review-v1.2.4-rc1
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Finalize File 10 1.2.4-rc1 release hygiene')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Synchronize active release identity
        run: python3 tools/file10-release-hygiene.py
      - name: Verify corrected release state
        run: |
          set -euo pipefail
          bash ./tests/run-all.sh
          git diff --check
      - name: Push permanent release hygiene evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests docs
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize File 10 1.2.4-rc1 active release contracts"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
