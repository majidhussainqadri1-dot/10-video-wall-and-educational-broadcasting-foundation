name: Materialize File 10 Round 1 Fixes

on:
  push:
    branches:
      - codex/file-10-full-plan-completion-v1.1.0-rc1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify, apply, test, and commit Round 1 fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -f .payload5/READY ]] || { echo 'Round 1 payload not ready.'; exit 0; }
          : > /tmp/file10-round1.b64
          for index in 00 01 02 03; do
            chunk=".payload5/part-${index}.b64"
            [[ -f "$chunk" ]] || { echo "Missing $chunk"; exit 1; }
            cat "$chunk" >> /tmp/file10-round1.b64
          done
          [[ "$(wc -c < /tmp/file10-round1.b64)" -eq 28960 ]] || { echo 'Invalid total payload length'; exit 1; }
          base64 -d /tmp/file10-round1.b64 > /tmp/file10-round1.tar.xz
          echo '47e5df4817f1ad89fdb65ebfb1ec95fb2f2b8f0a2b157bbec82e9f6d8cad4df3  /tmp/file10-round1.tar.xz' | sha256sum --check -
          xz -t /tmp/file10-round1.tar.xz
          tar -xJf /tmp/file10-round1.tar.xz -C .
          chmod +x tests/*.sh tests/*.py tools/*.sh 2>/dev/null || true
          bash ./tests/run-all.sh | tee /tmp/file10-round1-qa.log
          rm -rf .payload5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix File 10 fresh review round 1 defects'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload Round 1 QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file10-round1-materializer-qa
          path: /tmp/file10-round1-qa.log
          if-no-files-found: warn
